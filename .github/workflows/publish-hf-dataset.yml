name: Publish reviewed forum index to Hugging Face

on:
  pull_request:
    paths:
      - "dataset/**"
      - "examples/**"
      - "opportunities.json"
      - "scripts/publish_hf.py"
      - "scripts/verify_projection.py"
      - ".github/workflows/publish-hf-dataset.yml"
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Exact 40-character protected main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: szl-science-forum-hf-dataset
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -B -m scripts.publish_hf

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned provider client
        run: python -m pip install --disable-pip-version-check huggingface_hub==1.33.0
      - name: Publish exact main and read back every byte
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          SZL_HF_PUBLISH_APPROVED: "1"
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
        run: python -B -m scripts.publish_hf --publish --expected-sha "$EXPECTED_GIT_SHA"
